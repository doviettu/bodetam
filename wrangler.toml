# Worker "bodetam": phục vụ game (public/) + máy chủ phòng chùa (Durable Objects)
# Cloudflare Workers Builds tự chạy `npx wrangler deploy` mỗi khi repo có commit mới.
name = "bodetam"
main = "src/index.js"
compatibility_date = "2025-04-01"
preview_urls = false

# Trang game & file tĩnh; đường dẫn /room/* không có file nên đi vào Worker
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Các trang khác (ngoài chính bodetam.*.workers.dev) được phép kết nối phòng chùa
ALLOW_ORIGINS = "https://doviettu.github.io"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Gói miễn phí chỉ dùng được Durable Objects loại SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Kho sách riêng (Cloudflare R2) — phục vụ /sach/*. Chỉ vùng cong-khai/ được phát ra ngoài;
# vùng luu-tru/ là bản sao lưu riêng, Worker không bao giờ đọc. Hướng dẫn: docs/KHO-SACH-RIENG.md (repo doviettu/like).
[[r2_buckets]]
binding = "SACH"
bucket_name = "thu-vien-sach"
